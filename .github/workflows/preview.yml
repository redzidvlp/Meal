name: Preview build (demo mode)

# Deploys the working branch to GitHub Pages so it can be opened and tested
# on a real phone. The preview stays in the labelled demo household until you
# explicitly switch it on: set the repository variable USE_SUPABASE=true (and
# the two Supabase secrets) under Settings → Secrets and variables → Actions.
# This keeps a half-configured database from breaking the phone link.
on:
  push:
    branches: ["arena/7c386ed8-meal"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: preview-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build preview (demo mode)
        run: npm run build
        env:
          # Demo until vars.USE_SUPABASE is "true"; an empty URL selects the
          # local demo backend, so the link always opens on a phone.
          VITE_SUPABASE_URL: ${{ vars.USE_SUPABASE == 'true' && secrets.VITE_SUPABASE_URL || '' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.USE_SUPABASE == 'true' && secrets.VITE_SUPABASE_ANON_KEY || '' }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
